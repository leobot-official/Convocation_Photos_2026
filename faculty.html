<div class="app-card p-3 p-md-4">
  
  <!-- BRANDING HEADER -->
  <div class="d-flex align-items-center justify-content-between bg-light p-3 rounded-4 mb-4 border">
    <div>
      <h5 class="fw-bold text-dark mb-0">Faculty Approval Portal</h5>
      <small class="text-muted">Hindustan Institute of Technology & Science</small>
    </div>
  </div>

  <!-- GOOGLE SIGN-IN SECTION -->
  <div id="facultyAuthSection" class="card border-0 bg-light p-4 mb-4 rounded-4 shadow-sm text-center">
    <h5 class="fw-bold text-primary mb-2"><i class="bi bi-shield-lock me-2"></i>Faculty Authentication</h5>
    <p class="text-muted small mb-3">Please sign in with your official university email (@hindustanuniv.ac.in).</p>
    
    <div class="d-flex justify-content-center">
      <div id="g_id_onload"
           data-client_id="984380290235-fhvahq5uitrbecgttrm3q27emlhsb8bg.apps.googleusercontent.com"
           data-callback="handleFacultyGoogleSignIn"
           data-auto_prompt="false">
      </div>
      <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with" data-shape="rectangular"></div>
    </div>
    <div id="facultyAuthAlert" class="mt-3"></div>
  </div>

  <!-- AUTHENTICATED FACULTY DASHBOARD (HIDDEN UNTIL LOGIN SUCCESS) -->
  <div id="facultyPortalWrapper" style="display: none;">
    
    <!-- FACULTY USER INFO CARD -->
    <div class="card bg-primary text-white p-3 rounded-4 mb-4 shadow-sm">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h6 class="fw-bold mb-1" id="facName">--</h6>
          <div class="small opacity-75">
            <span id="facRoleBadge" class="badge bg-light text-primary me-2"></span>
            Dept: <strong id="facDept">--</strong> | Spec: <strong id="facSpec">--</strong> | Sec: <strong id="facSec">--</strong>
          </div>
        </div>
        <button class="btn btn-sm btn-outline-light" onclick="logoutFaculty()"><i class="bi bi-box-arrow-right"></i> Sign Out</button>
      </div>
    </div>

    <!-- PENDING APPROVALS LIST -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold text-dark mb-0"><i class="bi bi-card-checklist me-2"></i>Pending Applications</h5>
      <button class="btn btn-outline-primary btn-sm fw-bold" onclick="loadPendingApplications()">
        <i class="bi bi-arrow-clockwise me-1"></i> Refresh List
      </button>
    </div>

    <div id="applicationsContainer">
      <div class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span> Loading requests...</div>
    </div>

  </div>
</div>

<script>
  let currentFaculty = null;

  window.handleFacultyGoogleSignIn = async function(response) {
    const alertBox = document.getElementById('facultyAuthAlert');
    alertBox.innerHTML = '';

    try {
      const base64Url = response.credential.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const payload = JSON.parse(decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));

      const email = payload.email.toLowerCase();

      // Verify Faculty status with backend
      alertBox.innerHTML = `<div class="text-primary"><span class="spinner-border spinner-border-sm me-2"></span> Verifying Faculty Authorization...</div>`;

      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "facultyLogin", email: email })
      });
      const data = await res.json();

      if (data.success && data.faculty) {
        currentFaculty = data.faculty;
        
        // Render Dashboard
        document.getElementById('facName').innerText = currentFaculty.name;
        document.getElementById('facRoleBadge').innerText = currentFaculty.role;
        document.getElementById('facDept').innerText = currentFaculty.department;
        document.getElementById('facSpec').innerText = currentFaculty.specialization;
        document.getElementById('facSec').innerText = currentFaculty.section;

        document.getElementById('facultyAuthSection').style.display = 'none';
        document.getElementById('facultyPortalWrapper').style.display = 'block';

        loadPendingApplications();
      } else {
        alertBox.innerHTML = `<div class="alert alert-danger py-2 mt-2"><i class="bi bi-x-circle me-1"></i> ${data.message}</div>`;
      }
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-danger py-2 mt-2"><i class="bi bi-exclamation-triangle me-1"></i> Authentication Failed: ${err.message}</div>`;
    }
  };

  window.logoutFaculty = function() {
    currentFaculty = null;
    document.getElementById('facultyPortalWrapper').style.display = 'none';
    document.getElementById('facultyAuthSection').style.display = 'block';
    document.getElementById('facultyAuthAlert').innerHTML = '';
  };

  window.loadPendingApplications = async function() {
    const container = document.getElementById('applicationsContainer');
    container.innerHTML = `<div class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span> Loading applications...</div>`;

    try {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "getPendingApplications", email: currentFaculty.email })
      });
      const data = await res.json();

      if (data.success && data.data && data.data.length > 0) {
        let html = '';
        data.data.forEach(item => {
          html += `
            <div class="card border-0 shadow-sm p-3 mb-3 rounded-4 bg-light">
              <div class="row g-3 align-items-center">
                <div class="col-md-2 text-center">
                  <img src="${item.photoUrl || 'https://via.placeholder.com/100'}" class="img-thumbnail rounded-3" style="max-height: 120px; object-fit: cover;">
                </div>
                <div class="col-md-6">
                  <h6 class="fw-bold mb-1">${item.name} (${item.regNo})</h6>
                  <p class="small text-muted mb-1">
                    <strong>Dept:</strong> ${item.dept} | <strong>Spec:</strong> ${item.spec} | <strong>Sec:</strong> ${item.sec}
                  </p>
                  <div class="d-flex gap-2 mt-2">
                    ${item.proof10thUrl ? `<a href="${item.proof10thUrl}" target="_blank" class="btn btn-sm btn-outline-info py-0"><i class="bi bi-file-earmark-pdf"></i> 10th Proof</a>` : ''}
                    ${item.proofTcUrl ? `<a href="${item.proofTcUrl}" target="_blank" class="btn btn-sm btn-outline-info py-0"><i class="bi bi-file-earmark-pdf"></i> TC Proof</a>` : ''}
                  </div>
                </div>
                <div class="col-md-4">
                  <input type="text" id="remark_${item.rowIndex}" class="form-control form-control-sm mb-2" placeholder="Enter remarks/reason...">
                  <div class="d-flex gap-2">
                    <button class="btn btn-success btn-sm w-50 fw-bold" onclick="submitDecision(${item.rowIndex}, 'APPROVE')"><i class="bi bi-check-circle"></i> Approve</button>
                    <button class="btn btn-danger btn-sm w-50 fw-bold" onclick="submitDecision(${item.rowIndex}, 'REJECT')"><i class="bi bi-x-circle"></i> Reject</button>
                  </div>
                </div>
              </div>
            </div>`;
        });
        container.innerHTML = html;
      } else {
        container.innerHTML = `<div class="alert alert-info text-center rounded-3 py-3">No pending applications found for your section/department.</div>`;
      }
    } catch (err) {
      container.innerHTML = `<div class="alert alert-danger text-center rounded-3 py-2">Error loading applications: ${err.message}</div>`;
    }
  };

  window.submitDecision = async function(rowIndex, decision) {
    const remarks = document.getElementById(`remark_${rowIndex}`).value.trim();
    if (decision === 'REJECT' && !remarks) {
      alert("Please provide remarks for rejection.");
      return;
    }

    if (!confirm(`Are you sure you want to ${decision} this application?`)) return;

    try {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "processFacultyAction",
          rowIndex: rowIndex,
          decision: decision,
          remarks: remarks,
          role: currentFaculty.role
        })
      });
      const data = await res.json();

      if (data.success) {
        alert(data.message);
        loadPendingApplications();
      } else {
        alert("Failed to process action: " + data.message);
      }
    } catch (err) {
      alert("Error processing action: " + err.message);
    }
  };
</script>
