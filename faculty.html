<div class="app-card p-3 p-md-4">
  
  <!-- FACULTY LOGIN SECTION -->
  <div id="facultyLoginSection">
    <div class="text-center mb-4">
      
      <h4 class="fw-bold text-primary"><i class="bi bi-shield-lock me-2"></i>Faculty Approval Portal</h4>
      <p class="text-muted small">Hindustan Institute of Technology & Science</p>
    </div>

    <div class="card border-0 bg-light p-3 p-md-4 rounded-4 shadow-sm mb-3">
      <label class="form-label fw-bold small text-muted mb-2">Faculty Official Email Login</label>
      <div class="row g-2">
        <div class="col-md-9">
          <input type="email" id="facultyEmailInput" class="form-control form-control-lg" placeholder="e.g. claims@hindustanuniv.ac.in">
        </div>
        <div class="col-md-3">
          <button class="btn btn-primary btn-lg w-100 fw-bold shadow-sm" onclick="loginFaculty()">Login</button>
        </div>
      </div>
    </div>
    <div id="loginAlert"></div>
  </div>

  <!-- FACULTY DASHBOARD SECTION -->
  <div id="facultyDashboardSection" style="display:none;">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
      <div class="d-flex align-items-center gap-3">
        <img src="https://lh3.googleusercontent.com/d/148OBvNZskDANpINQYJcSB9NdXX71tB-T" alt="HITS Logo" style="height: 42px; width: auto;">
        <div>
          <h5 id="facultyWelcomeMsg" class="fw-bold text-primary mb-0"></h5>
          <small class="text-muted">Faculty Review Workspace</small>
        </div>
      </div>
      <button class="btn btn-outline-danger btn-sm fw-bold rounded-pill px-3" onclick="logoutFaculty()">
        <i class="bi bi-box-arrow-right me-1"></i> Logout
      </button>
    </div>

    <!-- Multi-role Dropdown Scope Selector -->
    <div class="card border-0 bg-light p-3 mb-4 rounded-3" id="roleSelectorContainer" style="display:none;">
      <label class="form-label fw-bold small text-muted">Active Scope Approval Scope:</label>
      <select id="roleSelect" class="form-select" onchange="loadFacultySubmissions()"></select>
    </div>

    <!-- SUBMISSIONS REVIEW TABLE -->
    <div class="table-responsive rounded-3 border">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-dark">
          <tr>
            <th style="width: 100px;">Photo</th>
            <th>Student Details</th>
            <th>Validation Status</th>
            <th style="width: 280px;">Review Action</th>
          </tr>
        </thead>
        <tbody id="facultyTableBody">
          <tr><td colspan="4" class="text-center text-muted py-4">Loading queue...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
 var activeFacultyProfiles = window.activeFacultyProfiles || [];

  async function loginFaculty() {
    const email = document.getElementById('facultyEmailInput').value.trim();
    const alertBox = document.getElementById('loginAlert');
    if (!email) {
      alertBox.innerHTML = `<div class="alert alert-warning py-2">Please enter an email.</div>`;
      return;
    }

    alertBox.innerHTML = `<div class="text-primary"><span class="spinner-border spinner-border-sm me-2"></span>Authenticating...</div>`;

    try {
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "authenticateFaculty", email: email })
      });
      const res = await response.json();

      if (res.success) {
        activeFacultyEmail = email;
        document.getElementById('facultyLoginSection').style.display = 'none';
        document.getElementById('facultyDashboardSection').style.display = 'block';
        document.getElementById('facultyWelcomeMsg').innerText = `Welcome, ${res.facultyName || email}`;
        
        if (res.roles && res.roles.length > 0) {
          const select = document.getElementById('roleSelect');
          select.innerHTML = res.roles.map(r => `<option value="${r}">${r}</option>`).join('');
          document.getElementById('roleSelectorContainer').style.display = 'block';
        }
        loadFacultySubmissions();
      } else {
        alertBox.innerHTML = `<div class="alert alert-danger py-2">${res.message || 'Access denied.'}</div>`;
      }
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-danger py-2">Login error: ${err.message}</div>`;
    }
  }

  function logoutFaculty() {
    activeFacultyEmail = "";
    document.getElementById('facultyDashboardSection').style.display = 'none';
    document.getElementById('facultyLoginSection').style.display = 'block';
    document.getElementById('facultyEmailInput').value = '';
  }

  async function loadFacultySubmissions() {
    const tbody = document.getElementById('facultyTableBody');
    tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4"><span class="spinner-border spinner-border-sm me-2"></span>Fetching submissions...</td></tr>`;

    try {
      const selectedScope = document.getElementById('roleSelect').value || "";
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "getSubmissionsForReview", email: activeFacultyEmail, scope: selectedScope })
      });
      const res = await response.json();

      if (res.success && res.data && res.data.length > 0) {
        tbody.innerHTML = res.data.map(item => `
          <tr>
            <td>
              <img src="${item.photoUrl || 'https://via.placeholder.com/80x100?text=No+Photo'}" class="img-thumbnail" style="width: 80px; height: 100px; object-fit: cover;">
            </td>
            <td>
              <div class="fw-bold">${item.studentName}</div>
              <small class="text-muted">Reg: ${item.registerNumber} | Sec: ${item.section || 'N/A'}</small><br>
              <small class="text-muted">Dept: ${item.department}</small>
            </td>
            <td>
              <span class="badge bg-${item.status === 'Approved' ? 'success' : item.status === 'Rejected' ? 'danger' : 'warning'}">${item.status}</span>
            </td>
            <td>
              <div class="input-group input-group-sm mb-1">
                <input type="text" id="remark_${item.registerNumber}" class="form-control" placeholder="Optional remark">
              </div>
              <div class="btn-group btn-group-sm w-100">
                <button class="btn btn-success" onclick="reviewSubmission('${item.registerNumber}', 'Approved')">Approve</button>
                <button class="btn btn-danger" onclick="reviewSubmission('${item.registerNumber}', 'Rejected')">Reject</button>
              </div>
            </td>
          </tr>
        `).join('');
      } else {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-4">No pending submissions found.</td></tr>`;
      }
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="4" class="text-center text-danger py-4">Failed to load records.</td></tr>`;
    }
  }

  async function reviewSubmission(regNo, status) {
    const remark = document.getElementById(`remark_${regNo}`).value.trim();
    try {
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "updateSubmissionStatus",
          email: activeFacultyEmail,
          registerNumber: regNo,
          status: status,
          remark: remark
        })
      });
      const res = await response.json();
      if (res.success) {
        loadFacultySubmissions();
      } else {
        alert("Action failed: " + res.message);
      }
    } catch (err) {
      alert("Error: " + err.message);
    }
  }
</script>
